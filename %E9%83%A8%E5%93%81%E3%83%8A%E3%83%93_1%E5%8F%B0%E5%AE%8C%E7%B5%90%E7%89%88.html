<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>部品ナビ｜1台完結版</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#17263a;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#153a65;color:white;padding:18px 16px}header h1{margin:0;font-size:21px}header small{opacity:.8}.wrap{max-width:650px;margin:auto;padding:16px}.panel{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 1px 6px #17263a16}.line{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#607084;font-size:13px}label{display:block;font-weight:700;margin:10px 0 5px}input,select{font:inherit;width:100%;padding:12px;border:1px solid #c6cfda;border-radius:9px;background:white}button{font:inherit;background:#153a65;color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer}button.alt{background:#e9eef5;color:#193b60}button.warn{background:#a93333}button:disabled{opacity:.5}button.small{padding:6px 9px;font-size:13px}.part h2{font-size:18px;margin:0 0 8px}.photo{width:100%;aspect-ratio:4/3;object-fit:contain;background:#eef2f6;border-radius:10px;display:block}.placeholder{aspect-ratio:4/3;background:#eef2f6;color:#8190a3;border-radius:10px;display:flex;align-items:center;justify-content:center}.pill{font-size:12px;color:#667;padding:5px 9px;background:#e9eef5;border-radius:20px}.edit{border-top:1px solid #e1e7ee;margin-top:12px;padding-top:10px}.hidden{display:none}.banner{background:#fff5dd;color:#76531f;border-radius:9px;padding:10px;font-size:13px;margin-bottom:12px}summary{cursor:pointer;font-weight:700}footer{color:#617184;font-size:12px;padding:12px 2px 28px}#msg{font-size:13px;color:#136241;min-height:18px;margin-top:8px}</style></head><body><header><h1>品目別・交換部品ナビ</h1><small>共用スマホ1台用 / ローカル保存</small></header><main class="wrap"><div class="banner">試用版です。会社の実情報・写真を登録する前に社内の許可を確認してください。正式な作業手順書の代わりにはなりません。</div><section class="panel"><label for="item">品目を選択</label><select id="item"></select><p class="muted" id="count"></p><div class="line"><button class="alt" id="editToggle">編集を開く</button><span class="pill" id="saved">読み込み中</span></div><p id="msg"></p></section><section class="panel edit hidden" id="admin"><h2 style="margin-top:0;font-size:18px">編集</h2><label>この品目の名前</label><input id="itemName" maxlength="60"><label>交換箇所の共通名称（全品目に反映）</label><div id="slotNames"></div><div class="line" style="margin-top:12px"><button id="saveBtn">変更をこの端末に保存</button><button class="alt" id="exportBtn">バックアップ保存</button></div><label for="importFile">バックアップから復元</label><input id="importFile" type="file" accept="application/json,.json"><p class="muted">写真を含むバックアップはJSONファイルです。復元すると現在の登録内容を置き換えます。</p></section><div id="list"></div><footer>保存先：このスマホのブラウザ内（IndexedDB）。GitHubへの自動アップロードは行いません。Safariのサイトデータ消去や端末交換で失われる場合があるため、バックアップを安全な保存先に定期保存してください。</footer></main><script>
(()=>{'use strict';const ID='parts-navi-single-device',SCHEMA=1;const $=id=>document.getElementById(id);let edit=false,db,data,dirty=false;const blank=()=>({version:SCHEMA,slotNames:Array.from({length:8},(_,i)=>`箇所${i+1}`),items:Array.from({length:10},(_,i)=>({name:`品目${i+1}`,slots:Array.from({length:8},()=>({needed:true,name:'',size:'',photo:''}))}))});
const openDB=()=>new Promise((res,rej)=>{let r=indexedDB.open(ID,1);r.onupgradeneeded=()=>r.result.createObjectStore('content');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const load=()=>new Promise((res,rej)=>{let t=db.transaction('content','readonly'),r=t.objectStore('content').get('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const persist=()=>new Promise((res,rej)=>{let t=db.transaction('content','readwrite');t.objectStore('content').put(data,'data');t.oncomplete=res;t.onerror=()=>rej(t.error)});const note=x=>{$('msg').textContent=x};const current=()=>Number($('item').value||0);const photoFit=file=>new Promise((res,rej)=>{if(!file.type.startsWith('image/'))return rej(Error('画像を選んでください'));if(file.size>15*1024*1024)return rej(Error('15MB以下の写真を選んでください'));const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1100,scale=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.76))};im.onerror=()=>{URL.revokeObjectURL(url);rej(Error('写真を開けません'))};im.src=url});const hasChanges=()=>{dirty=true;$('saved').textContent='未保存';note('編集後は「変更をこの端末に保存」を押してください')};
function render(){const id=current();const sel=$('item');sel.innerHTML='';data.items.forEach((v,i)=>{let o=document.createElement('option');o.value=i;o.textContent=v.name;sel.appendChild(o)});sel.value=id;$('count').textContent=`全8箇所・交換対象 ${data.items[id].slots.filter(x=>x.needed).length}箇所`;$('admin').classList.toggle('hidden',!edit);$('editToggle').textContent=edit?'編集を閉じる':'編集を開く';$('itemName').value=data.items[id].name;$('slotNames').replaceChildren();data.slotNames.forEach((n,i)=>{const el=document.createElement('div');const l=document.createElement('label');l.textContent=`箇所${i+1}`;const input=document.createElement('input');input.value=n;input.oninput=()=>{data.slotNames[i]=input.value;hasChanges();updateSlotTitles()};el.append(l,input);$('slotNames').appendChild(el)});const list=$('list');list.replaceChildren();data.items[id].slots.forEach((s,i)=>{const card=document.createElement('section');card.className='panel part';const top=document.createElement('div');top.className='line';const h=document.createElement('h2');h.textContent=data.slotNames[i];h.dataset.slotTitle=i;const pill=document.createElement('span');pill.className='pill';pill.textContent=s.needed?'交換対象':'交換不要';top.append(h,pill);card.append(top);if(s.needed){const p=document.createElement('p');p.textContent=s.name||'部品名未登録';p.style.fontWeight='700';card.append(p);if(s.size){const small=document.createElement('p');small.className='muted';small.textContent=`サイズ・形状：${s.size}`;card.append(small)}if(s.photo){const img=new Image();img.className='photo';img.src=s.photo;img.alt=`${data.slotNames[i]} の部品写真`;card.append(img)}else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent='写真未登録';card.append(ph)}}if(edit){const area=document.createElement('div');area.className='edit';const needed=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=s.needed;cb.style.width='auto';cb.onchange=()=>{s.needed=cb.checked;hasChanges();render()};needed.append(cb,document.createTextNode(' この品目では交換する'));area.append(needed);for(const [key,title] of [['name','部品名'],['size','サイズ・形状']]){const lab=document.createElement('label');lab.textContent=title;const inp=document.createElement('input');inp.value=s[key]||'';inp.oninput=()=>{s[key]=inp.value;hasChanges()};area.append(lab,inp)}const lab=document.createElement('label');lab.textContent='部品写真（端末内に保存）';const file=document.createElement('input');file.type='file';file.accept='image/*';file.onchange=async()=>{if(!file.files?.length)return;try{s.photo=await photoFit(file.files[0]);hasChanges();render()}catch(e){alert(e.message)}};area.append(lab,file);const del=document.createElement('button');del.className='small alt';del.textContent='写真を削除';del.onclick=()=>{s.photo='';hasChanges();render()};area.append(del);card.append(area)}list.append(card)})}
function updateSlotTitles(){document.querySelectorAll('[data-slot-title]').forEach(e=>e.textContent=data.slotNames[Number(e.dataset.slotTitle)]||'名称未設定')}
function valid(d){return d&&Array.isArray(d.items)&&d.items.length===10&&Array.isArray(d.slotNames)&&d.slotNames.length===8&&d.items.every(it=>typeof it.name==='string'&&Array.isArray(it.slots)&&it.slots.length===8&&it.slots.every(s=>typeof s.needed==='boolean'&&typeof s.name==='string'&&typeof s.photo==='string'))}
$('editToggle').onclick=()=>{edit=!edit;render()};$('item').onchange=()=>render();$('itemName').oninput=()=>{data.items[current()].name=$('itemName').value;hasChanges();const o=$('item').options[current()];if(o)o.textContent=data.items[current()].name};$('saveBtn').onclick=async()=>{try{await persist();dirty=false;$('saved').textContent='保存済み';note('このスマホに保存しました')}catch(e){alert('保存できません。ストレージの空き容量等を確認してください。 '+e.message)}};$('exportBtn').onclick=()=>{try{const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='parts-navi-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);note('バックアップをダウンロードしました')}catch(e){alert('バックアップに失敗しました')}};$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!valid(d))throw Error('形式が違います');if(!confirm('現在の登録内容をバックアップで置き換えますか？'))return;data=d;await persist();dirty=false;$('saved').textContent='保存済み';$('item').value='0';render();note('復元しました')}catch(err){alert('復元に失敗しました: '+err.message)}e.target.value=''};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});(async()=>{try{db=await openDB();let d=await load();data=valid(d)?d:blank();$('item').value='0';$('saved').textContent='保存済み';render()}catch(e){$('saved').textContent='保存不可';note('このブラウザでは端末保存を使えません。Safari/Chromeの通常タブで開いてください。')}})();})();
</script></body></html>
